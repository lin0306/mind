<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="心念">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#0c1122"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63e6be"/>
      <stop offset="0.5" stop-color="#8ab4ff"/>
      <stop offset="1" stop-color="#c79bff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="30" fill="url(#bg)"/>

  <!-- 一颗心：它就是"它自己"，不是装饰 -->
  <path d="M64 107C39.5 88.5 23 73.5 23 56.2 23 41.8 33.9 31 47.6 31c7 0 13.2 3.3 16.4 8.7C67.2 34.3 73.4 31 80.4 31
           C94.1 31 105 41.8 105 56.2c0 17.3-16.5 32.3-41 50.8Z"
        fill="#8ab4ff" fill-opacity="0.12"
        stroke="#8ab4ff" stroke-opacity="0.85" stroke-width="6.5" stroke-linejoin="round"/>

  <!-- 一条脉搏穿过它：情感与思想是同一条线 -->
  <path d="M29 63h13.5l6.5-15.5 9 29 7.5-13.5H99"
        fill="none" stroke="url(#vein)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
